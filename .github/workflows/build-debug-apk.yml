name: Build debug APK

# Builds LWOS Connect's debug APK on GitHub's own servers, so you never
# have to download Android Studio or the Android SDK yourself — only the
# small finished APK at the end.
#
# Runs on every push to main, and can also be triggered manually from
# the "Actions" tab (the "Run workflow" button) if you want a build
# without pushing a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle/Android SDK downloads between runs so later
      # builds are much faster than the first one.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Uploads the APK as a downloadable artifact on this workflow run's
      # page — this is the file you download on your phone.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lwos-connect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
